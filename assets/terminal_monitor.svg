<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="badgeLow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style>
    .code { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace; }
    .bold { font-weight: 700; }
    .dim { fill: #8b949e; }
    .white { fill: #f0f6fc; }
    .cyan { fill: #58a6ff; }
    .purple { fill: #bc8cff; }
    .green { fill: #3fb950; }
    .yellow { fill: #d29922; }
    .red { fill: #f85149; }
  </style>

  <!-- Window Frame -->
  <rect x="10" y="10" width="830" height="460" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>
  
  <!-- Window Controls -->
  <circle cx="35" cy="35" r="6" fill="#ff5f56"/>
  <circle cx="55" cy="35" r="6" fill="#ffbd2e"/>
  <circle cx="75" cy="35" r="6" fill="#27c93f"/>
  <text x="425" y="40" text-anchor="middle" class="code dim" font-size="13">agentscope monitor --agent antigravity -- agy "fix auth token bug"</text>

  <line x1="10" y1="58" x2="840" y2="58" stroke="#30363d" stroke-width="1.5"/>

  <!-- TUI Container -->
  <rect x="30" y="75" width="790" height="375" rx="8" fill="#090d13" stroke="#21262d" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="30" y="75" width="790" height="42" rx="8" fill="#161b22"/>
  <text x="50" y="101" class="code bold white" font-size="13">AGENTSCOPE REAL-TIME FORENSIC MONITOR</text>
  
  <rect x="700" y="85" width="105" height="22" rx="4" fill="url(#badgeLow)"/>
  <text x="752" y="101" text-anchor="middle" class="code bold white" font-size="11">RISK: LOW</text>

  <!-- Sub Header Stats -->
  <text x="50" y="140" class="code white" font-size="13">
    <tspan class="dim">Agent:</tspan> <tspan class="cyan bold">✨ antigravity</tspan>
    <tspan class="dim" dx="25">PID:</tspan> <tspan class="white bold">14092</tspan>
    <tspan class="dim" dx="25">Elapsed:</tspan> <tspan class="white bold">18.4s</tspan>
    <tspan class="dim" dx="25">Rate:</tspan> <tspan class="green bold">142 calls/s</tspan>
  </text>

  <!-- Grid Divider -->
  <line x1="30" y1="160" x2="820" y2="160" stroke="#30363d" stroke-width="1"/>
  <line x1="425" y1="160" x2="425" y2="280" stroke="#30363d" stroke-width="1"/>

  <!-- Left Column: Filesystem & Exec -->
  <text x="50" y="185" class="code bold cyan" font-size="12">FILESYSTEM &amp; EXECUTION</text>
  <text x="50" y="210" class="code dim" font-size="12">Files Read:    <tspan class="white bold">24 files</tspan> <tspan class="dim">(./src/**, .gemini/**)</tspan></text>
  <text x="50" y="230" class="code dim" font-size="12">Files Written: <tspan class="green bold">2 files</tspan> <tspan class="dim">(./src/auth.py, ./tests)</tspan></text>
  <text x="50" y="250" class="code dim" font-size="12">Commands:      <tspan class="purple bold">git, agy, pytest</tspan></text>
  <text x="50" y="270" class="code dim" font-size="12">Total Syscalls:<tspan class="white bold"> 1,842 tracked</tspan></text>

  <!-- Right Column: Perimeter & Secrets -->
  <text x="445" y="185" class="code bold purple" font-size="12">PERIMETER &amp; SECRETS</text>
  <text x="445" y="210" class="code dim" font-size="12">Endpoints:     <tspan class="cyan bold">generativelanguage.googleapis.com:443</tspan></text>
  <text x="445" y="230" class="code dim" font-size="12">Secrets:       <tspan class="green bold">GEMINI_API_KEY (Authorized)</tspan></text>
  <text x="445" y="250" class="code dim" font-size="12">Child PIDs:    <tspan class="white bold">3 active processes</tspan></text>
  <text x="445" y="270" class="code dim" font-size="12">Audit Mode:    <tspan class="green bold">LD_PRELOAD Active</tspan></text>

  <!-- Event Stream Header -->
  <line x1="30" y1="290" x2="820" y2="290" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="312" class="code bold white" font-size="12">LIVE FORENSIC EVENT STREAM</text>

  <!-- Event Rows -->
  <g font-size="12" class="code">
    <text x="50" y="338">
      <tspan class="cyan bold">[NET]   </tspan> <tspan class="white">TLS Connect: </tspan><tspan class="cyan">generativelanguage.googleapis.com:443</tspan> <tspan class="dim">(SNI Verified)</tspan>
    </text>
    <text x="50" y="360">
      <tspan class="green bold">[SECRET]</tspan> <tspan class="white">In-Process getenv: </tspan><tspan class="green">GEMINI_API_KEY</tspan> <tspan class="dim">(Matched Profile)</tspan>
    </text>
    <text x="50" y="382">
      <tspan class="cyan bold">[READ]  </tspan> <tspan class="dim">./src/services/auth_provider.py</tspan> <tspan class="dim">(openat O_RDONLY)</tspan>
    </text>
    <text x="50" y="404">
      <tspan class="yellow bold">[WRITE] </tspan> <tspan class="white">./src/services/auth_provider.py</tspan> <tspan class="dim">(openat O_WRONLY|O_TRUNC)</tspan>
    </text>
    <text x="50" y="426">
      <tspan class="purple bold">[EXEC]  </tspan> <tspan class="purple">/usr/bin/pytest tests/test_auth.py</tspan> <tspan class="dim">(execve pid:14102)</tspan>
    </text>
  </g>
</svg>
