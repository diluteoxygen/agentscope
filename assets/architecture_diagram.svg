<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d"/>
      <stop offset="100%" stop-color="#111927"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b382b"/>
      <stop offset="100%" stop-color="#0e2419"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1f47"/>
      <stop offset="100%" stop-color="#1a1129"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <style>
    .code { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace; }
    .bold { font-weight: 700; }
    .dim { fill: #8b949e; }
    .white { fill: #f0f6fc; }
    .cyan { fill: #58a6ff; }
    .purple { fill: #bc8cff; }
    .green { fill: #3fb950; }
    .yellow { fill: #d29922; }
  </style>

  <!-- Canvas Background -->
  <rect width="900" height="420" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>
  
  <text x="450" y="45" text-anchor="middle" class="code bold white" font-size="18">AGENTSCOPE FORENSIC ARCHITECTURE</text>
  <text x="450" y="68" text-anchor="middle" class="code dim" font-size="13">Multi-Layer Non-Intrusive Runtime Authority Tracing &amp; Containment</text>

  <!-- Layer 1: Agent Execution & Target Space -->
  <rect x="40" y="100" width="240" height="280" rx="8" fill="url(#purpleCard)" stroke="#8957e5" stroke-width="1.5"/>
  <text x="160" y="130" text-anchor="middle" class="code bold purple" font-size="14">1. AGENT WORKLOAD</text>
  <rect x="60" y="150" width="200" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="160" y="177" text-anchor="middle" class="code white" font-size="12">Google Antigravity (agy)</text>
  
  <rect x="60" y="210" width="200" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="160" y="237" text-anchor="middle" class="code white" font-size="12">Claude Code / Cursor / Aider</text>

  <rect x="60" y="270" width="200" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="160" y="297" text-anchor="middle" class="code white" font-size="12">Subprocess Trees &amp; Shells</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="280" y1="240" x2="325" y2="240" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Observation & Interception Engine -->
  <rect x="330" y="100" width="240" height="280" rx="8" fill="url(#blueCard)" stroke="#388bfd" stroke-width="1.5"/>
  <text x="450" y="130" text-anchor="middle" class="code bold cyan" font-size="14">2. FORENSIC SENSORS</text>

  <rect x="350" y="150" width="200" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="177" text-anchor="middle" class="code cyan" font-size="12">strace -f Syscall Tap</text>

  <rect x="350" y="210" width="200" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="237" text-anchor="middle" class="code cyan" font-size="12">LD_PRELOAD getenv Hook</text>

  <rect x="350" y="270" width="200" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="297" text-anchor="middle" class="code cyan" font-size="12">TLS SNI Packet Sniffer</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="570" y1="240" x2="615" y2="240" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Normalization & Enforcement -->
  <rect x="620" y="100" width="240" height="280" rx="8" fill="url(#greenCard)" stroke="#2ea043" stroke-width="1.5"/>
  <text x="740" y="130" text-anchor="middle" class="code bold green" font-size="14">3. GOVERNANCE &amp; OUTPUT</text>

  <rect x="640" y="150" width="200" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="740" y="177" text-anchor="middle" class="code green" font-size="12">Capability Fingerprint v1.0</text>

  <rect x="640" y="210" width="200" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="740" y="237" text-anchor="middle" class="code green" font-size="12">CI Authority Baseline Gate</text>

  <rect x="640" y="270" width="200" height="45" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="740" y="297" text-anchor="middle" class="code green" font-size="12">Active SIGKILL Containment</text>

  <!-- Footnote -->
  <text x="450" y="398" text-anchor="middle" class="code dim" font-size="11">Zero Cloud SaaS Dependencies • Local Linux Kernel Forensics • Pure Standard Library</text>
</svg>
